<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguồn theo dõi — Mozy</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .reject-reason-cell {
      font-size: 12px;
      color: var(--danger);
      margin-top: 4px;
      padding: 4px 8px;
      background: var(--danger-bg);
      border-radius: 4px;
      display: inline-block;
    }
    .status-dot.paused { background: var(--gray-400); }
  </style>
</head>
<body>
  <div class="layout" id="app"></div>
  <script src="shared.js"></script>
  <script>
    const state = { search: '', typeFilter: 'all', statusFilter: 'all' };

    function getFiltered() {
      let data = [...SOURCES];
      if (state.search) {
        const q = state.search.toLowerCase();
        data = data.filter(s => s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q));
      }
      if (state.typeFilter !== 'all') data = data.filter(s => s.type === state.typeFilter);
      if (state.statusFilter !== 'all') data = data.filter(s => s.status === state.statusFilter);
      return data;
    }

    function countActiveOrPending() {
      return SOURCES.filter(s => s.status === 'active' || s.status === 'pending').length;
    }

    function render() {
      const filtered = getFiltered();
      const sourceTypes = [...new Set(SOURCES.map(s => s.type))];
      const atLimit = countActiveOrPending() >= CURRENT_CUSTOMER.plan.sourceLimit;

      document.getElementById('app').innerHTML = `
        ${buildSidebar('sources')}
        <div class="main">
          ${buildHeader('Nguồn theo dõi')}
          <div class="content fade-in">
            ${atLimit ? '<div class="alert alert-warning">&#9888; Bạn đã đạt giới hạn ' + CURRENT_CUSTOMER.plan.sourceLimit + ' nguồn theo gói hiện tại. Vui lòng liên hệ nâng gói hoặc chờ Admin xử lý bớt các đề xuất đang chờ duyệt.</div>' : ''}
            <div class="card">
              <div class="card-header">
                <div class="toolbar" style="flex:1;">
                  <div class="search-box">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm tên, URL..." value="${state.search}">
                  </div>
                  <select class="filter-select" id="typeFilter">
                    <option value="all">Tất cả loại</option>
                    ${sourceTypes.map(t => `<option value="${t}" ${state.typeFilter === t ? 'selected' : ''}>${t}</option>`).join('')}
                  </select>
                  <select class="filter-select" id="statusFilter">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="active" ${state.statusFilter === 'active' ? 'selected' : ''}>Đang chạy</option>
                    <option value="error" ${state.statusFilter === 'error' ? 'selected' : ''}>Lỗi</option>
                    <option value="pending" ${state.statusFilter === 'pending' ? 'selected' : ''}>Chờ duyệt</option>
                    <option value="rejected" ${state.statusFilter === 'rejected' ? 'selected' : ''}>Bị từ chối</option>
                    <option value="paused" ${state.statusFilter === 'paused' ? 'selected' : ''}>Tạm ngưng bởi hệ thống</option>
                  </select>
                </div>
                <button class="btn btn-primary" onclick="openProposeSource()" ${atLimit ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>+ Đề xuất nguồn</button>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Tên nguồn / URL</th>
                      <th>Loại</th>
                      <th>Trạng thái</th>
                      <th>Chủ đề gán</th>
                      <th>Ngày thêm</th>
                      <th style="width:100px;"></th>
                    </tr>
                  </thead>
                  <tbody>
                    ${filtered.map(s => `
                      <tr style="cursor:default;">
                        <td>
                          <strong>${s.name}</strong>
                          <div style="font-size:12px;color:var(--gray-500);word-break:break-all;">${s.url}</div>
                          ${s.status === 'rejected' && s.rejectReason ? `<div class="reject-reason-cell">Lý do từ chối: ${s.rejectReason}</div>` : ''}
                        </td>
                        <td><span class="badge badge-neutral">${getSourceTypeIcon(s.type)} ${s.type}</span></td>
                        <td>${getStatusBadge(s.status)}${s.errorReason ? `<div style="font-size:11px;color:var(--danger);margin-top:2px;">${s.errorReason}</div>` : ''}</td>
                        <td>
                          <div style="display:flex;flex-wrap:wrap;gap:3px;">
                            ${s.topicIds.map(tid => { const t = TOPICS.find(x => x.id === tid); return t ? `<span class="badge badge-info" style="font-size:11px;">${t.name}</span>` : ''; }).join('')}
                            ${s.topicIds.length === 0 ? '<span style="color:var(--gray-400);font-size:12px;">—</span>' : ''}
                          </div>
                        </td>
                        <td style="white-space:nowrap;color:var(--gray-500);">${formatDate(s.addedAt)}</td>
                        <td>${s.status === 'rejected' ? `<button class="btn btn-outline btn-sm" onclick="openResend(${s.id})">Gửi lại</button>` : ''}</td>
                      </tr>
                    `).join('')}
                    ${filtered.length === 0 ? '<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">&#128279;</div><p>Chưa có nguồn nào. Bấm "Đề xuất nguồn" để bắt đầu!</p></div></td></tr>' : ''}
                  </tbody>
                </table>
              </div>
              <div class="pagination">
                <span>${filtered.length} nguồn &middot; Đã dùng ${countActiveOrPending()}/${CURRENT_CUSTOMER.plan.sourceLimit} (Đang chạy + Chờ duyệt)</span>
                <div class="progress-bar" style="width:120px;height:6px;">
                  <div class="progress-fill ${usageColor(usagePercent(countActiveOrPending(), CURRENT_CUSTOMER.plan.sourceLimit))}" style="width:${usagePercent(countActiveOrPending(), CURRENT_CUSTOMER.plan.sourceLimit)}%;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Propose Source Modal -->
        <div class="modal-overlay" id="proposeModal">
          <div class="modal">
            <div class="modal-header">
              <h3>Đề xuất nguồn mới</h3>
              <button class="modal-close" onclick="closeModal('proposeModal')">&times;</button>
            </div>
            <div class="modal-body">
              <form id="proposeForm">
                <div class="form-group">
                  <label class="form-label">URL nguồn <span class="required">*</span></label>
                  <input type="url" class="form-input" id="sUrl" required placeholder="https://example.com" value="">
                  <div class="form-hint">Nhập URL báo, fanpage, kênh YouTube, TikTok...</div>
                  <div class="form-error" id="sUrlError"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">Loại nguồn <span class="required">*</span></label>
                  <select class="form-select" id="sType" required>
                    <option value="">Chọn loại...</option>
                    <option value="Báo chí">Báo chí</option>
                    <option value="Facebook Fanpage">Facebook Fanpage</option>
                    <option value="Facebook Group">Facebook Group</option>
                    <option value="TikTok">TikTok</option>
                    <option value="YouTube">YouTube</option>
                    <option value="Zalo OA">Zalo OA</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Tên hiển thị</label>
                  <input type="text" class="form-input" id="sName" placeholder="Tự động lấy từ URL">
                  <div class="form-hint">Chỉ là gợi ý tên, Admin có thể đặt lại khi duyệt</div>
                </div>
              </form>
              <div class="alert alert-info" style="margin-top:12px;margin-bottom:0;">
                &#9432; Đề xuất sẽ được gửi đến Admin để duyệt. Nguồn sẽ bắt đầu thu thập sau khi được phê duyệt.
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" onclick="closeModal('proposeModal')">Hủy</button>
              <button class="btn btn-primary" onclick="submitProposal()">Gửi đề xuất</button>
            </div>
          </div>
        </div>

        <!-- Resend Proposal Modal -->
        <div class="modal-overlay" id="resendModal">
          <div class="modal" style="max-width:420px;">
            <div class="modal-header">
              <h3>Gửi lại đề xuất</h3>
              <button class="modal-close" onclick="closeModal('resendModal')">&times;</button>
            </div>
            <div class="modal-body" id="resendBody"></div>
            <div class="modal-footer">
              <button class="btn btn-outline" onclick="closeModal('resendModal')">Hủy</button>
              <button class="btn btn-primary" onclick="confirmResend()">Gửi lại</button>
            </div>
          </div>
        </div>`;

      document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; render(); });
      document.getElementById('typeFilter').addEventListener('change', e => { state.typeFilter = e.target.value; render(); });
      document.getElementById('statusFilter').addEventListener('change', e => { state.statusFilter = e.target.value; render(); });

      document.getElementById('sUrl').addEventListener('input', function() {
        if (!document.getElementById('sName').value || document.getElementById('sName').dataset.auto === 'true') {
          try { const u = new URL(this.value); document.getElementById('sName').value = u.hostname.replace('www.', ''); document.getElementById('sName').dataset.auto = 'true'; } catch {}
        }
      });
    }

    function openProposeSource() {
      document.getElementById('sUrl').value = '';
      document.getElementById('sType').value = '';
      document.getElementById('sName').value = '';
      document.getElementById('sUrlError').classList.remove('visible');
      openModal('proposeModal');
    }

    function submitProposal() {
      const url = document.getElementById('sUrl').value.trim();
      const type = document.getElementById('sType').value;
      let name = document.getElementById('sName').value.trim();
      const urlErr = document.getElementById('sUrlError');

      if (!url || !type) return;
      try { new URL(url); } catch { urlErr.textContent = 'URL không hợp lệ'; urlErr.classList.add('visible'); return; }
      urlErr.classList.remove('visible');
      if (!name) { try { name = new URL(url).hostname.replace('www.', ''); } catch { name = url; } }

      const exists = SOURCES.some(s => s.url.toLowerCase() === url.toLowerCase());
      if (exists) { urlErr.textContent = 'URL này đã tồn tại trong danh sách của bạn'; urlErr.classList.add('visible'); return; }

      SOURCES.push({
        id: Date.now(), name, url, type,
        status: 'pending', addedAt: new Date().toISOString().slice(0, 10),
        topicIds: [], keywordIds: []
      });
      showToast('Đã gửi đề xuất "' + name + '" — đang chờ Admin duyệt');
      closeModal('proposeModal');
      render();
    }

    // --- Resend rejected proposal ---
    let resendSourceId = null;
    function openResend(id) {
      const s = SOURCES.find(x => x.id === id);
      if (!s || s.status !== 'rejected') return;
      resendSourceId = id;
      document.getElementById('resendBody').innerHTML = `
        <p>Gửi lại đề xuất cho nguồn <strong>${s.name}</strong>?</p>
        <p style="font-size:13px;color:var(--gray-500);margin-top:8px;">Sẽ tạo 1 đề xuất mới (không sửa đề xuất cũ). Lịch sử lần bị từ chối trước vẫn được giữ.</p>
        ${s.rejectReason ? `<div class="alert alert-danger" style="margin-top:12px;margin-bottom:0;">Lý do bị từ chối lần trước: ${s.rejectReason}</div>` : ''}`;
      openModal('resendModal');
    }

    function confirmResend() {
      const s = SOURCES.find(x => x.id === resendSourceId);
      if (!s) return;
      s.status = 'pending';
      s.rejectReason = undefined;
      showToast('Đã gửi lại đề xuất "' + s.name + '" — đang chờ Admin duyệt');
      closeModal('resendModal');
      render();
    }

    render();
  </script>
</body>
</html>
