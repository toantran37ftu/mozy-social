<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Nguồn — Mozy Admin</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .source-url { color: var(--gray-500); font-size: 12px; word-break: break-all; }
    .origin-admin { color: var(--primary); font-weight: 600; }
    .origin-approved { color: var(--success); font-weight: 600; }
    .action-btns { display: flex; gap: 6px; }
    .status-dot.paused { background: var(--warning); }
  </style>
</head>
<body>
  <div class="layout" id="app"></div>

  <script src="shared.js"></script>
  <script>
    let state = {
      search: '',
      typeFilter: 'all',
      statusFilter: 'all',
      originFilter: 'all',
      page: 1,
      perPage: 10,
    };

    const SOURCE_TYPES = ['Báo chí', 'Facebook Fanpage', 'Facebook Group', 'TikTok', 'YouTube'];
    const STATUS_MAP = { active: 'Đang chạy', error: 'Lỗi', paused: 'Tạm ngưng bởi hệ thống' };

    function getFiltered() {
      let data = [...SOURCES];
      if (state.search) {
        const q = state.search.toLowerCase();
        data = data.filter(s => s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q));
      }
      if (state.typeFilter !== 'all') data = data.filter(s => s.type === state.typeFilter);
      if (state.statusFilter !== 'all') data = data.filter(s => s.status === state.statusFilter);
      if (state.originFilter !== 'all') data = data.filter(s => s.origin === state.originFilter);
      return data;
    }

    function render() {
      const filtered = getFiltered();
      const totalPages = Math.ceil(filtered.length / state.perPage);
      const pageData = filtered.slice((state.page - 1) * state.perPage, state.page * state.perPage);

      const app = document.getElementById('app');
      app.innerHTML = `
        ${buildSidebar('sources')}
        <div class="main">
          ${buildHeader('Quản lý Nguồn')}
          <div class="content fade-in">
            <div class="card">
              <div class="card-header">
                <div class="toolbar" style="flex:1;">
                  <div class="search-box">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm tên, URL..." value="${state.search}">
                  </div>
                  <select class="filter-select" id="typeFilter">
                    <option value="all" ${state.typeFilter === 'all' ? 'selected' : ''}>Tất cả loại</option>
                    ${SOURCE_TYPES.map(t => `<option value="${t}" ${state.typeFilter === t ? 'selected' : ''}>${t}</option>`).join('')}
                  </select>
                  <select class="filter-select" id="statusFilter">
                    <option value="all" ${state.statusFilter === 'all' ? 'selected' : ''}>Tất cả trạng thái</option>
                    <option value="active" ${state.statusFilter === 'active' ? 'selected' : ''}>Đang chạy</option>
                    <option value="error" ${state.statusFilter === 'error' ? 'selected' : ''}>Lỗi</option>
                    <option value="paused" ${state.statusFilter === 'paused' ? 'selected' : ''}>Tạm ngưng</option>
                  </select>
                  <select class="filter-select" id="originFilter">
                    <option value="all" ${state.originFilter === 'all' ? 'selected' : ''}>Tất cả nguồn gốc</option>
                    <option value="admin" ${state.originFilter === 'admin' ? 'selected' : ''}>Admin tự thêm</option>
                    <option value="approved" ${state.originFilter === 'approved' ? 'selected' : ''}>Duyệt từ đề xuất KH</option>
                  </select>
                </div>
                <button class="btn btn-primary" onclick="openAddSource()">+ Thêm nguồn</button>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Tên nguồn</th>
                      <th>URL</th>
                      <th>Loại nguồn</th>
                      <th>Trạng thái</th>
                      <th>Nguồn gốc</th>
                      <th>Ngày tạo</th>
                      <th style="width:140px;">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${pageData.map(s => `
                      <tr>
                        <td><strong>${s.name}</strong></td>
                        <td><div class="source-url">${s.url}</div></td>
                        <td><span class="badge badge-neutral">${s.type}</span></td>
                        <td>
                          <span class="status-dot ${s.status}"></span>
                          ${STATUS_MAP[s.status] || s.status}
                        </td>
                        <td>
                          ${s.origin === 'admin'
                            ? '<span class="origin-admin">Admin tự thêm</span>'
                            : '<span class="origin-approved">Duyệt từ đề xuất KH</span>'}
                        </td>
                        <td style="white-space:nowrap;color:var(--gray-500);">${formatDate(s.addedAt)}</td>
                        <td>
                          <div class="action-btns">
                            <button class="btn btn-outline btn-sm" onclick="openEditSource(${s.id})">Sửa</button>
                            <button class="btn btn-sm" style="color:var(--danger);border:1px solid var(--danger);background:#fff;" onclick="openActionModal(${s.id})">Xoá / Tạm ngưng</button>
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                    ${pageData.length === 0 ? '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">&#128269;</div><p>Không tìm thấy nguồn nào</p></div></td></tr>' : ''}
                  </tbody>
                </table>
              </div>
              <div class="pagination">
                <span>Hiển thị ${filtered.length === 0 ? 0 : (state.page-1)*state.perPage+1}–${Math.min(state.page*state.perPage, filtered.length)} trong ${filtered.length} kết quả</span>
                <div class="page-btns">
                  <button class="page-btn" onclick="goPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''}>&#8249; Trước</button>
                  ${Array.from({length: Math.min(totalPages, 5)}, (_, i) => {
                    let p;
                    if (totalPages <= 5) p = i + 1;
                    else if (state.page <= 3) p = i + 1;
                    else if (state.page >= totalPages - 2) p = totalPages - 4 + i;
                    else p = state.page - 2 + i;
                    return `<button class="page-btn ${p === state.page ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
                  }).join('')}
                  <button class="page-btn" onclick="goPage(${state.page + 1})" ${state.page >= totalPages ? 'disabled' : ''}>Sau &#8250;</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Add/Edit Source Modal -->
        <div class="modal-overlay" id="sourceModal">
          <div class="modal">
            <div class="modal-header">
              <h3 id="sourceModalTitle">Thêm nguồn mới</h3>
              <button class="modal-close" onclick="closeModal('sourceModal')">&times;</button>
            </div>
            <div class="modal-body">
              <form id="sourceForm">
                <div class="form-group">
                  <label class="form-label">URL <span class="required">*</span></label>
                  <input type="url" class="form-input" id="sUrl" required placeholder="https://example.com" value="">
                  <div class="form-hint">Hệ thống sẽ validate URL và thử crawl</div>
                  <div class="form-error" id="sUrlError"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">Loại nguồn <span class="required">*</span></label>
                  <select class="form-select" id="sType" required>
                    <option value="">Chọn loại...</option>
                    ${SOURCE_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Tên hiển thị</label>
                  <input type="text" class="form-input" id="sName" placeholder="Tự động lấy từ URL">
                  <div class="form-hint">Để trống sẽ tự lấy tên từ URL</div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" onclick="closeModal('sourceModal')">Hủy</button>
              <button class="btn btn-primary" id="sourceSubmitBtn" onclick="submitSource()">Thêm nguồn</button>
            </div>
          </div>
        </div>

        <!-- Action Modal (Delete / Pause) -->
        <div class="modal-overlay" id="actionModal">
          <div class="modal" style="max-width:480px;">
            <div class="modal-header">
              <h3 id="actionModalTitle">Xoá / Tạm ngưng nguồn</h3>
              <button class="modal-close" onclick="closeModal('actionModal')">&times;</button>
            </div>
            <div class="modal-body" id="actionBody"></div>
            <div class="modal-footer">
              <button class="btn btn-outline" onclick="closeModal('actionModal')">Hủy</button>
              <button class="btn btn-danger" id="confirmPauseBtn" onclick="confirmPause()" style="display:none;">Tạm ngưng</button>
              <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()" style="display:none;background:var(--gray-700);">Xoá hẳn</button>
            </div>
          </div>
        </div>`;

      document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; state.page = 1; render(); });
      document.getElementById('typeFilter').addEventListener('change', e => { state.typeFilter = e.target.value; state.page = 1; render(); });
      document.getElementById('statusFilter').addEventListener('change', e => { state.statusFilter = e.target.value; state.page = 1; render(); });
      document.getElementById('originFilter').addEventListener('change', e => { state.originFilter = e.target.value; state.page = 1; render(); });

      document.getElementById('sUrl').addEventListener('input', function() {
        if (!document.getElementById('sName').value || document.getElementById('sName').dataset.auto === 'true') {
          try { const u = new URL(this.value); document.getElementById('sName').value = u.hostname.replace('www.', ''); document.getElementById('sName').dataset.auto = 'true'; } catch {}
        }
      });
    }

    function goPage(p) {
      const filtered = getFiltered();
      const totalPages = Math.ceil(filtered.length / state.perPage);
      if (p < 1 || p > totalPages) return;
      state.page = p;
      render();
    }

    // --- Add Source ---
    let editingSourceId = null;
    function openAddSource() {
      editingSourceId = null;
      document.getElementById('sourceModalTitle').textContent = 'Thêm nguồn mới';
      document.getElementById('sUrl').value = '';
      document.getElementById('sUrl').disabled = false;
      document.getElementById('sType').value = '';
      document.getElementById('sName').value = '';
      document.getElementById('sUrlError').classList.remove('visible');
      document.getElementById('sourceSubmitBtn').textContent = 'Thêm nguồn';
      openModal('sourceModal');
    }

    // --- Edit Source ---
    function openEditSource(id) {
      const s = SOURCES.find(x => x.id === id);
      if (!s) return;
      editingSourceId = id;
      document.getElementById('sourceModalTitle').textContent = 'Sửa nguồn';
      document.getElementById('sUrl').value = s.url;
      document.getElementById('sUrl').disabled = true;
      document.getElementById('sType').value = s.type;
      document.getElementById('sName').value = s.name;
      document.getElementById('sUrlError').classList.remove('visible');
      document.getElementById('sourceSubmitBtn').textContent = 'Lưu thay đổi';
      openModal('sourceModal');
    }

    function submitSource() {
      const url = document.getElementById('sUrl').value.trim();
      const type = document.getElementById('sType').value;
      let name = document.getElementById('sName').value.trim();
      const urlErr = document.getElementById('sUrlError');

      if (!url || !type) return;
      try { new URL(url); } catch { urlErr.textContent = 'URL không hợp lệ'; urlErr.classList.add('visible'); return; }
      urlErr.classList.remove('visible');
      if (!name) { try { name = new URL(url).hostname.replace('www.', ''); } catch { name = url; } }

      if (!editingSourceId) {
        const exists = SOURCES.some(s => s.url.toLowerCase() === url.toLowerCase());
        if (exists) { urlErr.textContent = 'URL này đã tồn tại trong danh mục'; urlErr.classList.add('visible'); return; }
        SOURCES.push({
          id: Date.now(), name, url, type,
          status: 'active', addedAt: new Date().toISOString().slice(0, 10),
          origin: 'admin', followers: []
        });
        showToast('Đã thêm nguồn "' + name + '"');
      } else {
        const s = SOURCES.find(x => x.id === editingSourceId);
        if (s) { s.name = name; s.type = type; }
        showToast('Đã cập nhật nguồn "' + name + '"');
      }

      closeModal('sourceModal');
      render();
    }

    // --- Delete / Pause ---
    let actionSourceId = null;
    function openActionModal(id) {
      const s = SOURCES.find(x => x.id === id);
      if (!s) return;
      actionSourceId = id;
      const followerCount = s.followers ? s.followers.length : 0;
      const isPaused = s.status === 'paused';

      document.getElementById('actionModalTitle').textContent = isPaused ? 'Mở lại / Xoá nguồn' : 'Xoá / Tạm ngưng nguồn';
      document.getElementById('actionBody').innerHTML = `
        <p style="margin-bottom:12px;">Bạn đang thao tác trên nguồn <strong>${s.name}</strong></p>
        ${followerCount > 0 ? `<div class="alert alert-warning" style="margin-bottom:16px;">&#9888; Nguồn này đang được <strong>${followerCount} khách hàng</strong> theo dõi. Việc xoá/tạm ngưng sẽ ảnh hưởng đến tất cả KH này.</div>` : ''}
        ${isPaused ? `
          <p style="font-size:14px;color:var(--gray-600);margin-bottom:8px;">Nguồn đang tạm ngưng. Chọn hành động:</p>
          <button class="btn btn-success btn-sm" onclick="confirmResume()" style="margin-right:8px;">Mở lại</button>
        ` : `
          <p style="font-size:14px;color:var(--gray-600);margin-bottom:8px;">Chọn hành động:</p>
        `}
        <div style="display:flex;gap:12px;margin-top:12px;">
          ${!isPaused ? `<div style="flex:1;padding:12px;border:1px solid var(--gray-200);border-radius:8px;cursor:pointer;" onclick="document.getElementById('confirmPauseBtn').style.display='';document.getElementById('confirmDeleteBtn').style.display='none';">
            <div style="font-weight:600;color:var(--warning);margin-bottom:4px;">Tạm ngưng</div>
            <div style="font-size:12px;color:var(--gray-500);">Trạng thái chuyển "Tạm ngưng bởi hệ thống". Dữ liệu giữ nguyên.</div>
          </div>` : ''}
          <div style="flex:1;padding:12px;border:1px solid var(--gray-200);border-radius:8px;cursor:pointer;" onclick="document.getElementById('confirmDeleteBtn').style.display='';document.getElementById('confirmPauseBtn').style.display='none';">
            <div style="font-weight:600;color:var(--danger);margin-bottom:4px;">Xoá hẳn</div>
            <div style="font-size:12px;color:var(--gray-500);">Nguồn biến mất khỏi danh mục + khỏi list mọi KH.</div>
          </div>
        </div>`;
      document.getElementById('confirmPauseBtn').style.display = 'none';
      document.getElementById('confirmDeleteBtn').style.display = 'none';
      openModal('actionModal');
    }

    function confirmPause() {
      const s = SOURCES.find(x => x.id === actionSourceId);
      if (!s) return;
      s.status = s.status === 'paused' ? 'active' : 'paused';
      showToast(s.status === 'paused' ? 'Đã tạm ngưng nguồn "' + s.name + '"' : 'Đã mở lại nguồn "' + s.name + '"');
      closeModal('actionModal');
      render();
    }

    function confirmResume() {
      const s = SOURCES.find(x => x.id === actionSourceId);
      if (!s) return;
      s.status = 'active';
      showToast('Đã mở lại nguồn "' + s.name + '"');
      closeModal('actionModal');
      render();
    }

    function confirmDelete() {
      const s = SOURCES.find(x => x.id === actionSourceId);
      if (!s) return;
      const idx = SOURCES.findIndex(x => x.id === actionSourceId);
      if (idx >= 0) SOURCES.splice(idx, 1);
      showToast('Đã xoá nguồn "' + s.name + '"');
      closeModal('actionModal');
      render();
    }

    render();
  </script>
</body>
</html>
