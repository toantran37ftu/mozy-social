<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Nguồn — Mozy Admin</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .source-url { color: var(--gray-500); font-size: 12px; word-break: break-all; }
    .follower-count { font-weight: 700; color: var(--primary); }
    .follower-meta { font-size: 12px; color: var(--gray-500); }
  </style>
</head>
<body>
  <div class="layout" id="app"></div>
  <div class="detail-backdrop" id="detailBackdrop" onclick="closeDetail()"></div>
  <div class="detail-panel" id="detailPanel"></div>

  <script src="shared.js"></script>
  <script>
    let state = {
      search: '',
      typeFilter: 'all',
      statusFilter: 'all',
      customerFilter: 'all',
      sortField: 'followers',
      sortDir: 'desc',
      page: 1,
      perPage: 10,
    };

    const SOURCE_TYPES = ['Báo chí', 'Facebook Fanpage', 'Facebook Group', 'TikTok', 'YouTube'];
    const STATUS_MAP = { active: 'Đang chạy', error: 'Lỗi', pending: 'Chờ xác thực' };

    function getFiltered() {
      let data = [...SOURCES];
      if (state.search) {
        const q = state.search.toLowerCase();
        data = data.filter(s => s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q));
      }
      if (state.typeFilter !== 'all') {
        data = data.filter(s => s.type === state.typeFilter);
      }
      if (state.statusFilter !== 'all') {
        data = data.filter(s => s.status === state.statusFilter);
      }
      if (state.customerFilter !== 'all') {
        const cid = parseInt(state.customerFilter);
        data = data.filter(s => s.followers.includes(cid));
      }
      data.sort((a, b) => {
        let va, vb;
        if (state.sortField === 'followers') { va = a.followers.length; vb = b.followers.length; }
        else if (state.sortField === 'name') { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
        else { va = a[state.sortField]; vb = b[state.sortField]; }
        if (va < vb) return state.sortDir === 'asc' ? -1 : 1;
        if (va > vb) return state.sortDir === 'asc' ? 1 : -1;
        return 0;
      });
      return data;
    }

    function renderFollowerChips(source) {
      const names = source.followers.slice(0, 2).map(id => getCustomerName(id)).filter(Boolean);
      const extra = source.followers.length - names.length;
      if (names.length === 0) return '<span style="color:var(--gray-400);font-size:12px;">Không có KH</span>';
      let html = '<div class="follow-list">';
      names.forEach(n => { html += `<span class="follow-chip">${n}</span>`; });
      if (extra > 0) html += `<span class="follow-more" onclick="event.stopPropagation();openDetail(${source.id})">+${extra}</span>`;
      html += '</div>';
      return html;
    }

    function render() {
      const filtered = getFiltered();
      const totalPages = Math.ceil(filtered.length / state.perPage);
      const pageData = filtered.slice((state.page - 1) * state.perPage, state.page * state.perPage);

      const app = document.getElementById('app');
      app.innerHTML = `
        ${buildSidebar('sources')}
        <div class="main">
          ${buildHeader('Danh sách Nguồn (toàn hệ thống)')}
          <div class="content fade-in">
            <div style="margin-bottom:16px;">
              <div class="alert alert-info" style="margin:0;">
                &#128161; Đây là chế độ xem tổng hợp. Admin không thêm/sửa/xóa nguồn tại đây. Nguồn do KH tự thêm ở Customer Portal.
              </div>
            </div>
            <div class="card">
              <div class="card-header">
                <div class="toolbar" style="flex:1;">
                  <div class="search-box">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm tên, URL..." value="${state.search}">
                  </div>
                  <select class="filter-select" id="typeFilter">
                    <option value="all" ${state.typeFilter === 'all' ? 'selected' : ''}>Tất cả loại</option>
                    ${SOURCE_TYPES.map(t => `<option value="${t}" ${state.typeFilter === t ? 'selected' : ''}>${t}</option>`).join('')}
                  </select>
                  <select class="filter-select" id="statusFilter">
                    <option value="all" ${state.statusFilter === 'all' ? 'selected' : ''}>Tất cả trạng thái</option>
                    <option value="active" ${state.statusFilter === 'active' ? 'selected' : ''}>Đang chạy</option>
                    <option value="error" ${state.statusFilter === 'error' ? 'selected' : ''}>Lỗi</option>
                    <option value="pending" ${state.statusFilter === 'pending' ? 'selected' : ''}>Chờ xác thực</option>
                  </select>
                  <select class="filter-select" id="customerFilter">
                    <option value="all" ${state.customerFilter === 'all' ? 'selected' : ''}>Tất cả KH</option>
                    ${CUSTOMERS.map(c => `<option value="${c.id}" ${state.customerFilter == c.id ? 'selected' : ''}>${c.org}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th class="sortable" onclick="toggleSort('name')">Nguồn / URL <span class="sort-arrow">${sortIcon('name')}</span></th>
                      <th>Loại nguồn</th>
                      <th>Trạng thái</th>
                      <th class="sortable" onclick="toggleSort('followers')">KH đang follow <span class="sort-arrow">${sortIcon('followers')}</span></th>
                      <th>Ngày thêm đầu tiên</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${pageData.map(s => `
                      <tr class="clickable" onclick="openDetail(${s.id})">
                        <td>
                          <strong>${s.name}</strong>
                          <div class="source-url">${s.url}</div>
                        </td>
                        <td><span class="badge badge-neutral">${s.type}</span></td>
                        <td>
                          <span class="status-dot ${s.status}"></span>
                          ${STATUS_MAP[s.status] || s.status}
                        </td>
                        <td>
                          <span class="follower-count">${s.followers.length}</span> KH
                          ${renderFollowerChips(s)}
                        </td>
                        <td style="white-space:nowrap;color:var(--gray-500);">${formatDate(s.addedAt)}</td>
                      </tr>
                    `).join('')}
                    ${pageData.length === 0 ? '<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">&#128269;</div><p>Không tìm thấy nguồn nào</p></div></td></tr>' : ''}
                  </tbody>
                </table>
              </div>
              <div class="pagination">
                <span>Hiển thị ${(state.page-1)*state.perPage+1}–${Math.min(state.page*state.perPage, filtered.length)} trong ${filtered.length} kết quả</span>
                <div class="page-btns">
                  <button class="page-btn" onclick="goPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''}>&#8249; Trước</button>
                  ${Array.from({length: Math.min(totalPages, 5)}, (_, i) => {
                    let p;
                    if (totalPages <= 5) p = i + 1;
                    else if (state.page <= 3) p = i + 1;
                    else if (state.page >= totalPages - 2) p = totalPages - 4 + i;
                    else p = state.page - 2 + i;
                    return `<button class="page-btn ${p === state.page ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
                  }).join('')}
                  <button class="page-btn" onclick="goPage(${state.page + 1})" ${state.page >= totalPages ? 'disabled' : ''}>Sau &#8250;</button>
                </div>
              </div>
            </div>
          </div>
        </div>`;

      document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; state.page = 1; render(); });
      document.getElementById('typeFilter').addEventListener('change', e => { state.typeFilter = e.target.value; state.page = 1; render(); });
      document.getElementById('statusFilter').addEventListener('change', e => { state.statusFilter = e.target.value; state.page = 1; render(); });
      document.getElementById('customerFilter').addEventListener('change', e => { state.customerFilter = e.target.value; state.page = 1; render(); });
    }

    function toggleSort(field) {
      if (state.sortField === field) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortField = field; state.sortDir = 'desc'; }
      render();
    }
    function sortIcon(field) {
      if (state.sortField !== field) return '';
      return state.sortDir === 'asc' ? '&#9650;' : '&#9660;';
    }
    function goPage(p) {
      const filtered = getFiltered();
      const totalPages = Math.ceil(filtered.length / state.perPage);
      if (p < 1 || p > totalPages) return;
      state.page = p;
      render();
    }

    function openDetail(sourceId) {
      const source = SOURCES.find(s => s.id === sourceId);
      if (!source) return;

      const MOCK_KEYWORDS = {
        1: { 1: ['Chính sách CNTT', 'Kỹ thuật số'], 3: ['Chuyển đổi số', 'CNTT'], 10: ['Báo chí'] },
        2: { 1: ['Chính sách TT&TT'], 10: ['Thanh thiếu niên'] },
        3: { 3: ['Quốc tế', 'Kinh tế'], 19: ['Đô thị'] },
      };

      const panel = document.getElementById('detailPanel');
      const backdrop = document.getElementById('detailBackdrop');

      let followersHtml = source.followers.map(cid => {
        const c = CUSTOMERS.find(cc => cc.id === cid);
        if (!c) return '';
        const keywords = MOCK_KEYWORDS[source.id]?.[cid] || ['Keyword mẫu'];
        return `
          <div class="follower-item">
            <div style="flex:1;">
              <div class="follower-name">
                <a href="customer-detail.html?id=${cid}" style="text-decoration:none;">${c.org}</a>
              </div>
              <div class="follower-meta">Keyword/Chủ đề đang gán nguồn này:</div>
              <div class="tag-list">
                ${keywords.map(k => `<span class="tag">${k}</span>`).join('')}
              </div>
            </div>
            <span class="badge ${c.status === 'active' ? 'badge-success' : 'badge-danger'}" style="font-size:10px;">${c.status}</span>
          </div>`;
      }).join('');

      panel.innerHTML = `
        <div class="detail-panel-header">
          <div>
            <h3 style="font-size:16px;font-weight:600;">${source.name}</h3>
            <div style="font-size:13px;color:var(--gray-500);word-break:break-all;">${source.url}</div>
          </div>
          <button class="modal-close" onclick="closeDetail()">&times;</button>
        </div>
        <div class="detail-panel-body">
          <div class="info-grid" style="margin-bottom:20px;">
            <div class="info-label">Loại nguồn</div><div class="info-value"><span class="badge badge-neutral">${source.type}</span></div>
            <div class="info-label">Trạng thái</div><div class="info-value"><span class="status-dot ${source.status}"></span>${STATUS_MAP[source.status]}</div>
            <div class="info-label">KH đang follow</div><div class="info-value"><strong>${source.followers.length}</strong> khách hàng</div>
            <div class="info-label">Ngày thêm đầu tiên</div><div class="info-value">${formatDate(source.addedAt)}</div>
          </div>
          <div style="margin-bottom:12px;font-weight:600;font-size:14px;color:var(--gray-700);">Danh sách KH đang follow</div>
          ${source.followers.length === 0 ? '<div style="text-align:center;color:var(--gray-400);padding:20px;">Nguồn này không có KH nào follow</div>' : followersHtml}
        </div>`;

      panel.classList.add('open');
      backdrop.classList.add('open');
    }

    function closeDetail() {
      document.getElementById('detailPanel').classList.remove('open');
      document.getElementById('detailBackdrop').classList.remove('open');
    }

    render();
  </script>
</body>
</html>
