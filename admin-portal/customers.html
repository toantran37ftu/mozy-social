<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Khách hàng — Mozy Admin</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="layout" id="app"></div>

  <script src="shared.js"></script>
  <script>
    let state = {
      search: '',
      statusFilter: 'all',
      planFilter: 'all',
      sortField: 'createdAt',
      sortDir: 'desc',
      page: 1,
      perPage: 20,
    };

    function getFiltered() {
      let data = [...CUSTOMERS];
      if (state.search) {
        const q = state.search.toLowerCase();
        data = data.filter(c => c.org.toLowerCase().includes(q) || c.email.toLowerCase().includes(q));
      }
      if (state.statusFilter !== 'all') {
        data = data.filter(c => c.status === state.statusFilter);
      }
      if (state.planFilter !== 'all') {
        data = data.filter(c => c.planId === parseInt(state.planFilter));
      }
      data.sort((a, b) => {
        let va = a[state.sortField], vb = b[state.sortField];
        if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
        if (va < vb) return state.sortDir === 'asc' ? -1 : 1;
        if (va > vb) return state.sortDir === 'asc' ? 1 : -1;
        return 0;
      });
      return data;
    }

    function render() {
      const filtered = getFiltered();
      const totalPages = Math.ceil(filtered.length / state.perPage);
      const pageData = filtered.slice((state.page - 1) * state.perPage, state.page * state.perPage);

      const app = document.getElementById('app');
      app.innerHTML = `
        ${buildSidebar('customers')}
        <div class="main">
          ${buildHeader('Danh sách Khách hàng')}
          <div class="content fade-in">
            <div class="card">
              <div class="card-header">
                <div class="toolbar" style="flex:1;">
                  <div class="search-box">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm tên, email..." value="${state.search}">
                  </div>
                  <select class="filter-select" id="statusFilter">
                    <option value="all" ${state.statusFilter === 'all' ? 'selected' : ''}>Tất cả trạng thái</option>
                    <option value="active" ${state.statusFilter === 'active' ? 'selected' : ''}>Active</option>
                    <option value="inactive" ${state.statusFilter === 'inactive' ? 'selected' : ''}>Inactive</option>
                  </select>
                  <select class="filter-select" id="planFilter">
                    <option value="all" ${state.planFilter === 'all' ? 'selected' : ''}>Tất cả gói</option>
                    ${PLANS.map(p => `<option value="${p.id}" ${state.planFilter == p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
                  </select>
                </div>
                <a href="customer-detail.html" class="btn btn-primary">+ Thêm KH mới</a>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th class="sortable" onclick="toggleSort('org')">Tên tổ chức <span class="sort-arrow">${sortIcon('org')}</span></th>
                      <th>Email liên hệ</th>
                      <th>Gói đang dùng</th>
                      <th>Trạng thái</th>
                      <th class="sortable" onclick="toggleSort('createdAt')">Ngày tạo <span class="sort-arrow">${sortIcon('createdAt')}</span></th>
                      <th>Usage tháng</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${pageData.map(c => {
                      const plan = getPlan(c.planId);
                      if (!plan) return '';
                      const cPct = usagePercent(c.usage.crawl, plan.crawlLimit);
                      const kPct = usagePercent(c.usage.keywords, plan.keywordLimit);
                      const tPct = usagePercent(c.usage.topics, plan.topicLimit);
                      const sPct = usagePercent(c.usage.sources, plan.sourceLimit);
                      const maxPct = Math.max(cPct, kPct, tPct, sPct);
                      const isOver = maxPct > 90;
                      const overItems = [];
                      if (cPct > 90) overItems.push('Crawl: ' + cPct + '%');
                      if (kPct > 90) overItems.push('Keyword: ' + kPct + '%');
                      if (tPct > 90) overItems.push('Chủ đề: ' + tPct + '%');
                      if (sPct > 90) overItems.push('Nguồn: ' + sPct + '%');
                      return `
                        <tr class="clickable" onclick="window.location.href='customer-detail.html?id=${c.id}'">
                          <td>
                            <strong>${c.org}</strong>
                            ${isOver ? '<span class="badge badge-danger badge-overlimit" style="margin-left:6px;font-size:10px;" data-tooltip="Vượt ngưỡng: ' + overItems.join(', ') + '">&#9888;</span>' : ''}
                          </td>
                          <td style="color:var(--gray-500)">${c.email}</td>
                          <td><span class="badge badge-info">${plan.name}</span></td>
                          <td><span class="badge ${c.status === 'active' ? 'badge-success' : 'badge-neutral'}">${c.status === 'active' ? 'Active' : 'Inactive'}</span></td>
                          <td style="color:var(--gray-500); white-space:nowrap;">${formatDate(c.createdAt)}</td>
                          <td style="min-width:180px;">
                            <div style="display:flex;align-items:center;gap:8px;">
                              <div class="progress-bar" style="flex:1;">
                                <div class="progress-fill ${usageColor(cPct)}" style="width:${cPct}%;"></div>
                              </div>
                              <span style="font-size:12px;color:var(--gray-500);white-space:nowrap;">${formatNumber(c.usage.crawl)}/${formatNumber(plan.crawlLimit)}</span>
                            </div>
                          </td>
                        </tr>`;
                    }).join('')}
                    ${pageData.length === 0 ? '<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">&#128269;</div><p>Không tìm thấy khách hàng nào</p></div></td></tr>' : ''}
                  </tbody>
                </table>
              </div>
              <div class="pagination">
                <span>Hiển thị ${(state.page-1)*state.perPage+1}–${Math.min(state.page*state.perPage, filtered.length)} trong ${filtered.length} kết quả</span>
                <div class="page-btns">
                  <button class="page-btn" onclick="goPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''}>&#8249; Trước</button>
                  ${Array.from({length: Math.min(totalPages, 5)}, (_, i) => {
                    let p;
                    if (totalPages <= 5) p = i + 1;
                    else if (state.page <= 3) p = i + 1;
                    else if (state.page >= totalPages - 2) p = totalPages - 4 + i;
                    else p = state.page - 2 + i;
                    return `<button class="page-btn ${p === state.page ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
                  }).join('')}
                  <button class="page-btn" onclick="goPage(${state.page + 1})" ${state.page >= totalPages ? 'disabled' : ''}>Sau &#8250;</button>
                </div>
              </div>
            </div>
          </div>
        </div>`;

      document.getElementById('searchInput').addEventListener('input', e => {
        state.search = e.target.value;
        state.page = 1;
        render();
      });
      document.getElementById('statusFilter').addEventListener('change', e => {
        state.statusFilter = e.target.value;
        state.page = 1;
        render();
      });
      document.getElementById('planFilter').addEventListener('change', e => {
        state.planFilter = e.target.value;
        state.page = 1;
        render();
      });
    }

    function toggleSort(field) {
      if (state.sortField === field) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortField = field;
        state.sortDir = 'asc';
      }
      render();
    }
    function sortIcon(field) {
      if (state.sortField !== field) return '';
      return state.sortDir === 'asc' ? '&#9650;' : '&#9660;';
    }
    function goPage(p) {
      const filtered = getFiltered();
      const totalPages = Math.ceil(filtered.length / state.perPage);
      if (p < 1 || p > totalPages) return;
      state.page = p;
      render();
    }

    render();
  </script>
</body>
</html>
